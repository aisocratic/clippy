<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clippy states — see one, test one</title>
  <link rel="stylesheet" href="/states.css" />
</head>
<body>
  <header id="page-head">
    <h1>Fox transitions</h1>
    <nav aria-label="Other workbenches">
      <a href="/">Single state ↗</a>
      <a href="/settings/">Settings ↗</a>
    </nav>
  </header>

  <main>
    <section class="tester" aria-labelledby="tester-title">
      <header class="tester-head">
        <div class="tester-title">
          <span class="label">Live tester</span>
          <strong id="tester-title">Click any state — it plays here, in the real renderer</strong>
        </div>
        <div class="tester-controls">
          <label>buddy <select id="pick-character"></select></label>
          <label>size <select id="pick-size"></select></label>
          <button id="reset-frame" type="button">↺ Reset buddy</button>
        </div>
      </header>
      <div class="tester-body">
        <div class="tester-stage">
          <iframe id="live-frame" title="Live renderer"></iframe>
          <p id="now-playing" aria-live="polite">Nothing playing yet — pick a state.</p>
        </div>
        <div id="scenario-list" class="scenario-list" aria-label="Every sandbox state"></div>
      </div>
    </section>

    <section class="flow-summary">
      <p id="graph-note">The whole lifecycle of a prompt — click a node to play that state above.</p>
      <div class="global-actions">
        <button id="play-all" type="button">▶ Play all</button>
        <button id="reset-all" type="button">↺ Reset animations</button>
      </div>
    </section>

    <section id="flows" aria-label="Fox response graph"></section>
  </main>

  <template id="stage-template">
    <article class="stage" tabindex="0">
      <header>
        <span class="step" aria-hidden="true"></span>
        <h3></h3>
      </header>
      <div class="preview"></div>
    </article>
  </template>

  <script src="/states.js"></script>
</body>
</html>
