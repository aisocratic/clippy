name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    # The root package intentionally declares macOS-only support, so npm will
    # reject installation before tests on a Linux runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
