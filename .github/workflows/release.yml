name: Release macOS installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      CLIPPY_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      CLIPPY_NOTARY_PROFILE: clippy-notary
      CLIPPY_KEYCHAIN: ${{ runner.temp }}/clippy-release.keychain-db
      CLIPPY_KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Confirm tag version
        run: node -e "require('./scripts/verify-release').assertTagMatchesPackageVersion(process.env.GITHUB_REF_NAME)"
      - run: npm ci
      - run: npm run test:all
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/clippy-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$CLIPPY_KEYCHAIN_PASSWORD" "$CLIPPY_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$CLIPPY_KEYCHAIN"
          security unlock-keychain -p "$CLIPPY_KEYCHAIN_PASSWORD" "$CLIPPY_KEYCHAIN"
          security import "$certificate" -k "$CLIPPY_KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CLIPPY_KEYCHAIN_PASSWORD" "$CLIPPY_KEYCHAIN"
          security list-keychains -d user -s "$CLIPPY_KEYCHAIN" login.keychain-db
          security default-keychain -d user -s "$CLIPPY_KEYCHAIN"
      - name: Configure App Store Connect notarization
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$api_key"
          xcrun notarytool store-credentials "$CLIPPY_NOTARY_PROFILE" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$CLIPPY_KEYCHAIN"
      - name: Build signed and notarized installer
        run: npm run package:release
      - name: Verify release artifact
        run: npm run verify:release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Clippy-for-Claude-Code.dmg \
            dist/Clippy-for-Claude-Code.dmg.sha256 \
            --verify-tag \
            --generate-notes
