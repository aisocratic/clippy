<!DOCTYPE html>
<html>

  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <!-- A window, not a popup: it has a title bar, it resizes, it can be left
       open behind other things, and it does not follow the buddy around. The
       point of it is that a 4000-character plan has nowhere to go on a 300px
       panel floating over the desktop. -->
  <header id="head">
    <div id="who"></div>
    <div id="what"></div>
  </header>
  <main id="body" class="markdown"></main>
  <script src="markdown.js"></script>
  <script src="reader.js"></script>
</body>
</html>
