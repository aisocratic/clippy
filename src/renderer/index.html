<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="clippy.css" />
</head>
<body>
  <div id="stage">
    <div id="card" class="hidden">
      <div id="card-head">
        <span id="card-queue" class="hidden"></span>
        <button id="btn-goto" class="dim hidden"
                title="Bring this session's terminal window to the front">go to terminal ↗</button>
      </div>
      <div id="card-title"></div>
      <div id="card-detail" class="markdown hidden"></div>
      <div id="card-options" class="hidden"></div>
      <textarea id="card-input" rows="2" spellcheck="false"></textarea>
      <div id="card-actions">
        <button id="btn-allow" class="good">Allow</button>
        <button id="btn-deny" class="bad">Deny</button>
        <button id="btn-pass" class="dim">Ask me in terminal</button>
        <button id="btn-good" class="good">Looks good</button>
        <button id="btn-feedback" class="bad">Send feedback</button>
        <button id="btn-submit" class="good">Submit answer</button>
        <button id="btn-dismiss" class="dim">Dismiss</button>
      </div>
      <div id="card-countdown"><div id="card-countdown-fill"></div></div>
    </div>

    <div id="drive" class="hidden">
      <div id="drive-head">
        <span id="drive-title">📎 Clippy-driven session</span>
        <button id="drive-stop" class="dim">stop</button>
      </div>
      <div id="drive-transcript"></div>
      <div id="drive-activity" class="hidden"></div>
      <div id="drive-input-row">
        <textarea id="drive-input" rows="2" spellcheck="false" placeholder="Type a prompt for Claude…"></textarea>
        <button id="drive-send" class="good">Send</button>
      </div>
    </div>

    <div id="qcard" class="hidden">
      <div id="qcard-head"><span id="qcard-tag">asking you</span></div>
      <div id="qcard-title"></div>
      <div id="qcard-detail" class="markdown hidden"></div>
      <div id="qcard-actions">
        <button id="btn-qgoto" class="good hidden"
                title="Bring this session's terminal window to the front, where the picker is waiting">go to terminal ↗</button>
        <button id="btn-qok" class="dim">Answer in terminal ✓</button>
      </div>
    </div>

    <!-- One left click opens this, collapsed: a glance at the session — its
         state, what the agent is doing right now, the model, and how full the
         context is. ▾ grows the same window into the fuller panel (the
         allowance bars, the plan note, and a box to keep talking to it), and
         ▴ folds it back. Never a second window. -->
    <div id="usage" class="hidden collapsed">
      <!-- No name row here: the RPG plate under the buddy already carries the
           pet's name and the folder · model line under it. -->
      <div id="usage-status"></div>
      <div id="usage-recap" class="hidden"></div>
      <div id="usage-bar"><div id="usage-bar-fill"></div></div>
      <div id="usage-context"></div>
      <div id="usage-detail">
        <div id="usage-bars"></div>
        <div id="usage-note"></div>
        <!-- The placeholder has one line to live on now, so the hint that used
             to ride along with it moved to the tooltip. -->
        <textarea id="usage-input" rows="1" spellcheck="false"
                  title="Typed into this session's terminal — Enter sends it"
                  placeholder="Chat here"></textarea>
      </div>
      <div id="usage-actions">
        <button id="btn-usage-close" class="dim">Close</button>
        <!-- One button, two directions: it grows this same panel into the full
             view and shrinks it back again. Never a second window. Plain: the
             colour on a button means "this is the answer", and unfolding a
             panel isn't answering anything. -->
        <button id="btn-usage-size"
                title="Show more: the allowance bars, and a box to talk to this agent">▾</button>
        <!-- Only once there is something to send — see #usage.composing. -->
        <button id="btn-usage-send" class="good">Send ↵</button>
      </div>
    </div>

    <!-- The 💬 button under the buddy opens this: a word with the *pet*, which
         never reaches the session it is sitting on. -->
    <div id="pet" class="hidden">
      <div id="pet-head">
        <span id="pet-who">your pet</span>
        <button id="pet-close" class="dim">close</button>
      </div>
      <div id="pet-log"></div>
      <textarea id="pet-input" rows="1" spellcheck="false"
                title="Goes to your pet, never to the coding session — Enter sends it"
                placeholder="Say hi"></textarea>
    </div>

    <div id="bubble" class="hidden">
      <div id="bubble-text" class="markdown"></div>
      <div id="bubble-actions">
        <button id="btn-fix" class="good hidden">Open Settings ↗</button>
        <button id="btn-ok">Got it</button>
        <button id="btn-snooze">Snooze 5m</button>
      </div>
    </div>

    <!-- Right-click the buddy and the menu drops out from under him: what you
         can do with *this* session, then the app itself. Everything that
         applies to every buddy lives in the settings window (📎 in the menu
         bar). Placed here, before #clippy, so — like every other panel — it
         renders above him and leaves his own spot on screen alone. -->
    <div id="menu" class="hidden">
      <div id="menu-head">
        <span id="menu-name">session</span><span id="menu-status">idle</span>
      </div>

      <button id="menu-waiting" class="menu-item hidden"><span class="mi">📨</span>See what's waiting</button>
      <button id="menu-stats" class="menu-item"><span class="mi">📊</span>Stats &amp; token usage</button>

      <div class="menu-sep"></div>

      <button id="menu-settings" class="menu-item"><span class="mi">⚙</span>Settings…</button>
      <button id="menu-hide" class="menu-item dim"><span class="mi">×</span>Hide Clippy</button>
    </div>

    <!-- The two things that don't need the menu — put this buddy away, or say
         something to it. Words rather than glyphs, because a × and a speech
         bubble at 10px are a guess and "hide" and "chat" are not.

         This row does not stay here. With nothing open it floats above the
         buddy's head and only while the pointer is on him; the moment a panel
         opens, that panel owns the space and placeControls (clippy.js) moves
         this node inside it, where it becomes the panel's own footer. -->
    <div id="controls">
      <button id="btn-hide" title="Hide (Clippy keeps running in the menu bar)">hide</button>
      <button id="btn-chat" title="Chat with your pet — this never reaches the coding session">chat</button>
    </div>

    <div id="clippy">
      <!-- Generated characters animate inside GIFs built by `npm run make-buddies`;
           the paperclip has one set per session colour. -->
      <img id="buddy" width="96" height="120" alt="" />
      <!-- Built-in SVG buddies are drawn live, so their curves stay smooth at
           every size and their accent can follow the session colour. -->
      <div id="buddy-vector" class="hidden"></div>
      <!-- A dropped-in sprite-sheet theme is drawn here instead: one PNG per
           mood, stepped frame by frame (see applySheet in clippy.js). -->
      <div id="buddy-sheet" class="hidden"></div>
      <div id="badge" class="hidden">0</div>
    </div>

    <!-- Shown when Clippy has walked down to the session's prompt: an arrow
         under his feet, pointing at the line you're meant to type in. -->
    <div id="pointer" class="hidden">
      <span id="pointer-hint">answer here</span>
      <span id="pointer-arrow">▼</span>
    </div>

    <!-- The buddy's name plate — under its feet, no card around it, just text
         the drop shadow keeps legible over whatever wallpaper it lands on: the
         pet's name, and under it the folder it is watching and the model that
         folder is spending. -->
    <div id="who" title="Which coding-agent session this buddy is watching">
      <span id="who-pet">…</span>
      <span id="who-sub">…</span>
    </div>

    <div id="activity" class="hidden"></div>
    <div id="statusline">waiting for sessions…</div>
  </div>
  <script src="vector-buddies.js"></script>
  <script src="markdown.js"></script>
  <script src="summary.js"></script>
  <script src="clippy.js"></script>
</body>
</html>
